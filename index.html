<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Colégio Faculdade Hiperativo - Educação integral do Ensino Fundamental ao Mestrado. Matrículas abertas!" />
    <meta name="keywords" content="colégio, faculdade, educação integral, mestrado, especialização, cursos técnicos, esportes" />
    <meta name="author" content="Colégio Faculdade Hiperativo" />
    <meta name="theme-color" content="#1a56db" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Colégio Faculdade Hiperativo | Educação que Transforma</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Live Server não compila TSX/React; o app roda no Vite (npm run dev). -->
    <script>
      (function () {
        var port = parseInt(location.port, 10);
        if (port < 5500 || port > 5599) return;
        if (document.querySelector('script[src*="/assets/"]')) return;
        var path = location.pathname.replace(/\/index\.html$/i, '') || '/';
        location.replace(
          'http://localhost:5173' + path + location.search + location.hash,
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
